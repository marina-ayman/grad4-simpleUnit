<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامر الرياضيات - الصف الرابع الابتدائي</title>
    <link rel="stylesheet" href="site-nav.css">
    <script src="reviewAndH-translations.js" defer></script>
    <script src="site-nav.js" defer></script>
    <script src="review-feedback.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="reviewAndH-tailwind.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

      <link rel="stylesheet" href="reviewAndH.css">
  <script src="reviewAndH.js" defer></script>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-brand-pink selection:text-white">

    <div id="site-nav-root"></div>
    <!-- Header -->
    <header class="relative z-10 backdrop-filter backdrop-blur-lg shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-tr from-brand-purple to-brand-pink rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg animate-float">
                    <i class="fa-solid font-bold fa-calculator"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-brand-purple via-brand-pink to-brand-yellow">
                        <span class="emoji-bounce">🚀</span> مغامر الرياضيات الذكي <span class="emoji-bounce emoji-delay">🌟</span>
                    </h1>
                    <p class="text-xs text-slate-500 font-bold">الصف الرابع الابتدائي - مراجعة شاملة وممتعة</p>
                </div>
            </div>
            <div class="flex items-center gap-4 bg-slate-100 p-2 rounded-2xl border border-slate-200">
                <div class="flex items-center gap-1.5 px-3 py-1 bg-amber-100 text-amber-700 rounded-xl font-black text-sm">
                    <i class="fa-solid fa-star text-amber-500 text-lg star-glow animate-bounce"></i>
                    <span id="score">0</span> درجة
                </div>
                <div class="flex items-center gap-1.5 px-3 py-1 bg-emerald-100 text-emerald-700 rounded-xl font-black text-sm">
                    <i class="fa-solid fa-circle-check text-emerald-500 text-lg"></i>
                    <span id="completed-count">0</span> / <span id="total-questions">0</span>
                </div>
                <button id="sound-toggle" onclick="toggleSound()" class="w-9 h-9 bg-white text-slate-600 rounded-xl flex items-center justify-center hover:bg-slate-200 transition shadow-sm">
                    <i class="fa-solid fa-volume-high" id="sound-icon"></i>
                </button>
            </div>
        </div>
        <div class="w-full bg-slate-200 h-2.5">
            <div id="overall-progress" class="h-2.5 transition-all duration-500 w-0"></div>
        </div>
    </header>

    <!-- Main -->
    <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-1 grid grid-cols-1 lg:grid-cols-4 gap-6">
        <aside class="lg:col-span-1 space-y-3">
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-200 sticky top-24">
                <h2 class="text-sm font-black text-slate-400 uppercase tracking-wider mb-3 px-2 flex items-center gap-2">
                    <i class="fa-solid fa-map"></i> أقسام المراجعة
                </h2>
                <nav id="sections-nav" class="space-y-2"></nav>
            </div>
        </aside>
        <section class="lg:col-span-3 space-y-6">
            <div id="section-header" class="bg-gradient-to-r from-brand-purple to-indigo-600 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden flex items-center justify-between">
                <div class="relative z-10">
                    <span id="section-badge" class="bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold mb-2 inline-block">القسم 1</span>
                    <h2 id="section-title" class="text-2xl md:text-3xl font-black mb-1">...</h2>
                    <p id="section-desc" class="text-white/80 text-sm">...</p>
                </div>
                <div class="text-6xl text-white/20 z-0">
                    <i id="section-icon" class="fa-solid fa-shapes"></i>
                </div>
            </div>
            <div id="questions-container" class="space-y-6"></div>
        </section>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 mt-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 font-bold">
            مغامر الرياضيات الذكي للصف الرابع الابتدائي - تم التصميم للتلميذ الذكي 🌟
        </div>
    </footer>

    <!-- ===== Audio System ===== -->
    <!-- ===== App Data & Logic ===== -->
    </body>
</html>
