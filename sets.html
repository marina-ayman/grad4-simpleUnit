<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Sets on a Number Line</title>
    <link rel="stylesheet" href="site-nav.css">
    <script src="site-nav.js" defer></script>
      <link rel="stylesheet" href="sets.css">
  <script src="sets.js" defer></script>
</head>
<body>
<div id="site-nav-root"></div>
<div class="app-card">

    <h1 id="title">📏 10 Sets on a Number Line</h1>
    <div class="subhead" id="subhead">
        ⚡ 10 sets of 10 = 100 · 10 sets of 100 = 1,000 · 10 sets of 100,000 = 1 million · ...
    </div>

    <!-- TABS -->
    <div class="section-tabs" id="tabs">
        <button class="tab-btn active" data-scene="0">
            <span class="tab-label">🔹 10 sets of 10</span>
            <span class="small-badge">= 100</span>
        </button>
        <button class="tab-btn" data-scene="1">
            <span class="tab-label">🔸 10 sets of 100</span>
            <span class="small-badge">= 1,000</span>
        </button>
        <button class="tab-btn" data-scene="2">
            <span class="tab-label">🔹 10 sets of 100,000</span>
            <span class="small-badge">= 1 million</span>
        </button>
        <button class="tab-btn" data-scene="3">
            <span class="tab-label">🔸 10 sets of 1,000,000</span>
            <span class="small-badge">= 10 million</span>
        </button>
        <button class="tab-btn" data-scene="4">
            <span class="tab-label">🔶 10 sets of 10,000,000</span>
            <span class="small-badge">= 100 million</span>
        </button>
    </div>

    <!-- NUMBER LINE -->
    <div class="number-line-section">
        <div class="line-header">
            <h3 id="lineTitle">🔢 Number line: 0 → 100</h3>
            <span class="range-badge" id="rangeBadge">0 – 100</span>
        </div>
        <div class="line-container">
            <div class="number-line" id="numberLine"></div>
        </div>
    </div>

    <!-- EQUATION -->
    <div class="equation-box" id="equationBox"></div>

    <!-- EXPLANATIONS -->
    <div class="explain-grid" id="explainGrid"></div>

    <div class="footnote" id="footnote">
        ⚡ Each jump on the number line represents one "set". Ten equal jumps land on the result.
    </div>
</div>

</body>
</html>
